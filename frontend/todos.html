<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERN Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-section">
        <div id="signup-div">
            <h2>Signup</h2>
            <input type="text" id = "signup-name" placeholder="name"> <br>
            <input type="text" id="signup-email" placeholder="email"> <br>
            <input type="password" id="signup-password" placeholder="password"><br>
            <button onclick="signup()">Signup</button>
             <p>Already registered?
                <a href="#" onclick="showLogin()">Login</a>
            </p>
        </div>

        <div id="login-div" style="display: none;">
            <h2>Login</h2>
           
            <input type="text" id="login-email" placeholder="email"> <br>
            <input type="password" id="login-password" placeholder="password"><br>
            <button onclick="login()">Login</button>
           <p>New user?
                <a href="#" onclick="showSignup()">Signup</a>
            </p>
        </div>
        </div>
        
        <div id="todo-section" style="display: none;">
            <h2>Your Todos</h2>
            <div>
                <input type="text" id="input-container" placeholder="Add todo..."><br>
                <button id="add">Add Todo</button><br>
                <button onclick="logout()" style="background-color: red;">Logout</button>
            </div>
            <div id="todos-list"></div>
        </div>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="todos.js"></script>
</body>
</html>
